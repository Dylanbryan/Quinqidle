<style>
:root{--bg:#F3F5F9;--sf:#fff;--ink:#12182B;--mute:#5B6479;--line:#DDE2EC;--ac:#2447F5;--onac:#fff;--ok:#17895B;--warn:#A86A00;--okbg:#E3F5EC;--wbg:#FBF0D9;--r:14px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1424;--sf:#171D31;--ink:#E8ECF8;--mute:#9AA3BA;--line:#2A3350;--ac:#7B93FF;--onac:#0F1424;--ok:#4FD39B;--warn:#F2B84B;--okbg:#14352A;--wbg:#3A2E12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1424;--sf:#171D31;--ink:#E8ECF8;--mute:#9AA3BA;--line:#2A3350;--ac:#7B93FF;--onac:#0F1424;--ok:#4FD39B;--warn:#F2B84B;--okbg:#14352A;--wbg:#3A2E12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,.brand{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:700}
.seg{display:flex;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font:600 14px Figtree,system-ui,sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--onac)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.2;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card.tap{cursor:pointer}
.card h2{font-size:18px;line-height:1.3;margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta{color:var(--mute);font-size:14px;display:flex;gap:12px;flex-wrap:wrap}
.price{font-weight:600}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.wait{background:var(--wbg);color:var(--warn)}.tag.ac{background:var(--ac);color:var(--onac)}
button.btn{background:var(--ac);color:var(--onac);border:0;border-radius:10px;font:600 15px Figtree,system-ui,sans-serif;padding:11px 16px;cursor:pointer}
button.btn.ghost{background:none;color:var(--ac);border:1px solid var(--line)}
button.link{background:none;border:0;color:var(--ac);font:600 15px Figtree,system-ui,sans-serif;padding:0;cursor:pointer;margin-bottom:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:16px Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chips button{flex:none;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:999px;font:500 14px Figtree,system-ui,sans-serif;padding:6px 14px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.steps div{font-size:12px;color:var(--mute);border-top:4px solid var(--line);padding-top:4px}
.steps div.on{border-color:var(--ac);color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stats .card{margin:0}.stats b{display:block;font:700 24px 'Bricolage Grotesque',Figtree,sans-serif}
.empty{text-align:center;color:var(--mute);padding:32px 12px}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.skills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.av{border-radius:50%;object-fit:cover;background:var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:700;flex:none}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
:root{--co:#F27D68;--navy:#12305C;--pn:#E6EBF3;--pt:#4A5878;--chip:#D5DCEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--co:#FF9580;--navy:#3A5FA8;--pn:#1F2740;--pt:#B8C2DC;--chip:#2F3A5C}}
:root[data-theme="dark"]{--co:#FF9580;--navy:#3A5FA8;--pn:#1F2740;--pt:#B8C2DC;--chip:#2F3A5C}
.pv{background:var(--sf);border:1px solid var(--line);border-radius:24px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.pv .side{display:flex;flex-direction:column;align-items:center;gap:16px}
.pv .vl{display:none;background:var(--co);width:2px;border-radius:2px}
.pv .main{min-width:0}
.pv h1{font-size:34px;line-height:1.1;margin:4px 0 0}
.pv .tl{height:2px;background:var(--co);position:relative;margin:12px 5px 16px 0}
.pv .tl::after{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--co)}
.pv .pn{background:var(--pn);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.pv .pn h2{font-size:17px;color:var(--pt);margin-bottom:8px}
.pv .tag{background:var(--chip);color:var(--pt)}
button.btn.msgb{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;width:100%;border-radius:14px;padding:13px 16px}
.star{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;padding:0 2px}
@media (min-width:560px){.pv{grid-template-columns:140px 2px minmax(0,1fr);gap:20px}.pv .vl{display:block}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sf);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 15px Figtree,system-ui,sans-serif;padding:10px;border-radius:10px;cursor:pointer}
nav button.on{color:var(--ac);background:var(--bg)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.pv .tag.ok{background:var(--okbg);color:var(--ok)}.pv .tag.wait{background:var(--wbg);color:var(--warn)}
.pvw{background:var(--sf);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(18,24,43,.08);margin-bottom:12px}
.pvw .pv{border:0;border-radius:0;background:none;padding:0 20px 20px}
.cover{height:104px;background:radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 1.6px) 0 0/18px 18px,linear-gradient(120deg,var(--navy) 0%,#2D4D8C 60%,var(--co) 150%)}
.avw{position:relative;margin-top:-62px}
.avw .av{border:4px solid var(--sf);box-shadow:0 6px 18px rgba(18,24,43,.22)}
.dot{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;border:3px solid var(--sf)}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-bottom:14px}
.stats4>div{background:var(--pn);border-radius:14px;padding:10px 12px;border-bottom:3px solid var(--co)}
.stats4 b{display:block;font:700 20px 'Bricolage Grotesque',Figtree,sans-serif;line-height:1.2}
.stats4 span{font-size:12px;color:var(--pt)}
.pv .pn h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--co);margin-right:8px}
.rq{background:var(--sf);border-radius:14px;padding:10px 12px;margin-top:10px}
.rq p{margin:4px 0 2px}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.pv .pn,.stats4>div{animation:up .35s ease both}
@media (prefers-reduced-motion:reduce){.pv .pn,.stats4>div{animation:none}}
nav button{font-size:14px;padding:10px 4px}
.bdg{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-left:6px;vertical-align:middle}
:root{--cw:#E7ECF3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cw:#0C1120}}
:root[data-theme="dark"]{--cw:#0C1120}
body.chat{background:var(--cw);padding-bottom:0}
body.chat::before{background:var(--sf)}
body.chat header,body.chat nav{display:none}
body.chat main{padding:0;max-width:760px}
.chd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--line)}
.chd .chn{display:flex;flex-direction:column;line-height:1.25}.chd .chn span{font-size:12px;color:var(--mute)}
.bk{border:0;background:none;color:var(--ink);padding:6px;border-radius:50%;cursor:pointer;display:flex}
.chm{padding:8px 12px 96px;min-height:70vh;background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.dsep{text-align:center;margin:14px 0 4px}
.dsep span{background:var(--sf);color:var(--mute);font-size:12px;padding:3px 10px;border-radius:999px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bub{width:fit-content;max-width:80%;margin-top:8px;padding:6px 10px 4px;border-radius:18px;background:var(--sf);box-shadow:0 1px 1px rgba(0,0,0,.08);overflow-wrap:anywhere}
.bub.g{margin-top:2px}
.bub.tail{border-bottom-left-radius:4px}
.bub.mine{margin-left:auto;background:var(--ac);color:var(--onac)}
.bub.mine.tail{border-bottom-left-radius:18px;border-bottom-right-radius:4px}
.bub::after{content:"";display:block;clear:both}
.tm{float:right;font-size:11px;opacity:.7;margin:8px 0 0 10px;white-space:nowrap}
.cmp{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--cw);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.cmpi{max-width:740px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
.cmpi textarea{flex:1;min-height:44px;max-height:120px;border-radius:22px;padding:11px 16px;resize:none;background:var(--sf);border:1px solid var(--line);line-height:1.3}
.snd{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.srch{border-radius:999px;background:var(--sf)}
.crow{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cm{flex:1;min-width:0}
.ct,.cp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cd{font-size:12px;color:var(--mute);flex:none}.cd.u{color:var(--ac);font-weight:600}
.cp>span:first-child{flex:1;min-width:0;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub{min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:var(--onac);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
:root{--cbg:#E8EDF4;--cdot:rgba(18,24,43,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cbg:#0C1120;--cdot:rgba(255,255,255,.045)}}
:root[data-theme="dark"]{--cbg:#0C1120;--cdot:rgba(255,255,255,.045)}
body.chat{background:radial-gradient(var(--cdot) 1.2px,transparent 1.3px) 0 0/22px 22px,var(--cbg);padding-bottom:76px}
body.chat::before{background:var(--sf)}
.chat header,.chat nav,.chat #app>p.note{display:none}
.chat main{padding:0}
.chh{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;background:var(--sf);border-bottom:1px solid var(--line);padding:8px 12px 8px 6px}
.chh .bk{background:none;border:0;color:var(--ink);padding:6px;cursor:pointer;display:flex;border-radius:50%}
.chh b{display:block;line-height:1.25}.chh small{color:var(--mute);font-size:12px}
.chb{padding:8px 12px 4px;display:flex;flex-direction:column}
.day{align-self:center;background:var(--sf);color:var(--mute);font-size:12px;padding:3px 10px;border-radius:999px;margin:12px 0 6px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.mb{max-width:80%;align-self:flex-start;background:var(--sf);color:var(--ink);padding:6px 10px 4px;border-radius:14px;margin-top:2px;box-shadow:0 1px 1px rgba(0,0,0,.1);overflow-wrap:anywhere}
.mb.f{margin-top:8px;border-top-left-radius:4px}
.mb.me{align-self:flex-end;background:var(--ac);color:var(--onac)}
.mb.me.f{border-top-left-radius:14px;border-top-right-radius:4px}
.mb .tm{display:block;text-align:right;font-style:normal;font-size:11px;opacity:.75;margin-top:1px}
.mb .tk{font-weight:600}
.chc{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.chc>div{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.chc textarea{flex:1;min-height:44px;height:44px;max-height:120px;border-radius:22px;padding:11px 16px;resize:none;background:var(--sf)}
.snd{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.cl{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cl .mid{min-width:0;flex:1}
.cl .t{font-size:12px;color:var(--mute);flex:none}
.cl.un .t{color:var(--ac);font-weight:600}
.cl .pre{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cl.un .pre{color:var(--ink);font-weight:600}
.nb{background:var(--ac);color:var(--onac);min-width:22px;height:22px;border-radius:11px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
.acct{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;color:var(--ink);font:600 13px Figtree,system-ui,sans-serif;cursor:pointer}
.hr{display:flex;align-items:center;gap:8px}
.hr .seg button{font-size:13px;padding:6px 10px}
.hr .acct{padding:3px}
.err{background:var(--errbg);color:var(--err);padding:8px 12px;border-radius:10px;font-size:14px;margin:0 0 8px}
:root{--errbg:#FDECEA;--err:#B42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--errbg:#3A1A18;--err:#FF9A87}}
:root[data-theme="dark"]{--errbg:#3A1A18;--err:#FF9A87}

return '<section class="hero"><h1>Hire great freelancers. Or get hired.</h1><p>Quinqidle connects clients with freelancers in design, writing, development, marketing and more.</p><div class="row" style="justify-content:flex-start"><button class="btn light" onclick="scr=\'signup\';aerr=\'\';render();scrollTo(0,0)">Get started</button><button class="btn outl" onclick="scr=\'browse\';render();scrollTo(0,0)">Browse jobs</button></div></section>'
+'<h2 class="sec">How it works</h2><div class="grid3">'+steps.map(function(x){return '<div class="card"><span class="num">'+x[0]+'</span><h2>'+x[1]+'</h2><p class="note" style="margin:0">'+x[2]+'</p></div>'}).join('')+'</div>'
+'<h2 class="sec">Built for both sides</h2><div class="grid2"><div class="card"><h2>For clients</h2><ul class="ul"><li>Post a job with a budget and the skills you need</li><li>Compare proposals and view full freelancer profiles</li><li>Message freelancers before you hire</li><li>Approve the finished work, then leave a review</li></ul></div><div class="card"><h2>For freelancers</h2><ul class="ul"><li>Browse every open job</li><li>Build a profile with services, portfolio and credentials</li><li>Send proposals with your own price</li><li>Collect reviews that appear on your profile</li></ul></div></div>'
+'<h2 class="sec">Popular categories</h2><div class="chipwrap">'+Object.keys(SK).slice(0,12).map(function(c){return '<span class="tag">'+esc(c)+'</span>'}).join('')+'</div>'
+'<section class="cta"><h2>Ready to start?</h2><p class="note">Create an account in a minute.</p><button class="btn" onclick="scr=\'signup\';aerr=\'\';render();scrollTo(0,0)">Create your account</button></section><p class="note foot">© 2026 Quinqidle. Demo site: accounts and emails are simulated.</p>'}
function browseView(){var js=S.jobs.filter(function(j){return j.status==='open'&&(cat==='All'||j.cat===cat)});
var h='<button class="link" onclick="goHome()">Back to home</button><h1>Browse jobs</h1><p class="sub">Open jobs from clients. Create an account to apply.</p><label for="fc" style="margin-top:0">Category</label><select id="fc" onchange="cat=this.value;render()">'+CATS.map(function(c){return '<option value="'+esc(c)+'"'+(c===cat?' selected':'')+'>'+(c==='All'?'All categories':esc(c))+'</option>'}).join('')+'</select><p></p>';
if(!js.length)return h+'<div class="empty">No open jobs in this category right now.</div>';
return h+'<div class="grid2">'+js.map(function(j){return '<div class="card" style="margin:0"><h2>'+esc(j.title)+'</h2><div class="meta"><span class="price">'+money(j.budget)+'</span><span>'+esc(j.cat)+'</span><span>'+esc(j.client)+'</span></div><p class="note" style="margin:8px 0 0">'+esc(j.desc)+'</p><div class="skills">'+skillTags(jobSkills(j).join(','))+'</div><button class="btn ghost" style="margin-top:6px" onclick="scr=\'signup\';aerr=\'\';render();scrollTo(0,0)">Sign up to apply</button></div>'}).join('')+'</div>'}
function renderAuth(){var cl=document.body.classList,site=(scr==='home'||scr==='browse');if(cl){cl.remove('chat');if(site)cl.add('site');else cl.remove('site')}$('#nav').innerHTML='';
if(site){$('#seg').innerHTML='<div class="hr"><button class="btn ghost sm" onclick="scr=\'login\';aerr=\'\';render()">'+tx('login')+'</button><button class="btn sm" onclick="scr=\'signup\';aerr=\'\';render()">Get started</button></div>';$('#app').innerHTML=(scr==='home'?homeView():browseView())+prefsBar();return}
$('#seg').innerHTML='';var lg='<div style="text-align:center;margin:4px 0 14px"><span class="logo lg" role="img" aria-label="Quinqidle logo"></span></div>';var h=scr==='signup'?signupView():scr==='forgot'?forgotView():(scr==='verify'&&pend)?verifyView():(scr==='newpw'&&pend&&pend.verified)?newpwView():loginView();$('#app').innerHTML=lg+(SECURE?'':'<p class="err">Secure password hashing is not available in this browser, so accounts are disabled.</p>')+h+prefsBar()}
function doSignup(){if(busy)return;var n=$('#sn').value.trim(),e=normE($('#se').value),r='client',p=$('#sp').value,c=$('#sc').value;ad={name:n,email:e,role:r};aerr='';
if(!SECURE)return;
if(!n){aerr='Enter your name.';return render()}
if(!EMAIL_RE.test(e)){aerr='Enter a valid email address.';return render()}
if(findU(e)){aerr='An account with this email already exists. Try logging in.';return render()}
if(!pwOk(p)){aerr='Use at least 8 characters, with a letter and a number.';return render()}
if(p!==c){aerr='The passwords do not match.';return render()}
busy=true;var salt=b64(newSalt());
hashPw(p,salt).then(function(h){pend={kind:'signup',name:n,email:e,role:r,salt:salt,hash:h,code:code6(),exp:Date.now()+6e5,tries:0,sent:Date.now()};otpMail(e);scr='verify';aerr='';busy=false;render()}).catch(function(){busy=false;aerr='Something went wrong. Please try again.';render()})}
function doVerify(){if(!pend)return;var v=($('#vc').value||'').trim();
if(Date.now()>pend.exp){aerr='That code has expired. Tap Resend code.';return render()}
if(pend.tries>=5){aerr='Too many attempts. Tap Resend code to get a new one.';return render()}
if(!/^[0-9]{6}$/.test(v)){aerr='Enter the 6-digit code.';return render()}
if(pend.sb){if(busy)return;busy=true;var em=pto(),P=pend;
 sbPost('/auth/v1/verify',{type:'email',email:em,token:v}).then(function(r){busy=false;if(pend!==P)return;if(r.ok&&r.body.access_token){sbStore(r.body,String(em).toLowerCase());vdone()}else{pend.tries++;aerr='That code is not correct or has expired. Tap Resend code for a new one.';render()}}).catch(function(){busy=false;aerr='Network problem. Please try again.';render()});return}
if(!same(v,pend.code)){pend.tries++;aerr='That code is not correct. '+(5-pend.tries)+' attempts left.';return render()}
vdone()}
function vdone(){aerr='';if(pend.kind==='signup')finishSignup();else if(pend.kind==='reset'){pend.verified=true;pend.vexp=Date.now()+6e5;scr='newpw';render()}else finishEmail()}
function resend(){if(!pend)return;if(Date.now()-pend.sent<30000){aerr='Please wait a few seconds before requesting another code.';return render()}pend.code=code6();pend.exp=Date.now()+6e5;pend.tries=0;pend.sent=Date.now();otpMail(pto());aerr='';toast('New code sent');render()}
function cancelVerify(){if(pend&&pend.kind==='signup')scr='signup';else if(pend&&pend.kind==='reset')scr='forgot';else ecs=0;pend=null;aerr='';render()}
function finishSignup(){var p=pend;if(findU(p.email)){aerr='An account with this email already exists.';pend=null;scr='login';return render()}
var u={id:uid(),email:p.email,name:p.name,role:p.role,salt:p.salt,hash:p.hash};
AUTH.users.push(u);AUTH.session=u.id;asave();
S.names[u.id]=u.name;S.profiles[u.id]=newProf(u.name);
SAMPLE.forEach(function(t){var j=JSON.parse(JSON.stringify(t));j.id=S.next++;j.owner=u.id;j.client=u.name;j.cat=CATMAP[j.cat]||j.cat;j.props.forEach(function(q){q.id=S.next++});S.jobs.unshift(j)});
pend=null;aerr='';ad={name:'',email:'',role:'client'};enter(u);save();toast('Account created')}
function pto(){return pend.kind==='email'?pend.newEmail:pend.email}
function keepEmail(){var e=$('#le');if(e)ad.email=normE(e.value)}
function forgotView(){return '<h1>Reset your password</h1><p class="sub">Enter your email and we will send a 6-digit code.</p><div class="card">'+errBox()+field('fe','Email','email',ad.email,'autocomplete="email" inputmode="email"')+'<p></p><button class="btn" style="width:100%" onclick="startReset()">Send code</button></div><p class="sub" style="text-align:center"><button class="link" style="margin:0" onclick="scr=\'login\';aerr=\'\';render()">Back to log in</button></p>'}
function newpwView(){return '<h1>Create a new password</h1><p class="sub">Your code was verified. Choose a new password for <b>'+esc(pend.email)+'</b>.</p><div class="card">'+errBox()+pwField('np','New password','new-password')+'<p class="note">At least 8 characters, with a letter and a number.</p>'+pwField('nc','Confirm new password','new-password')+'<p></p><button class="btn" style="width:100%" onclick="doReset()">Save password</button></div><p class="sub" style="text-align:center"><button class="link" style="margin:0" onclick="pend=null;scr=\'login\';aerr=\'\';render()">Cancel</button></p>'}
function startReset(){if(busy)return;var e=normE($('#fe').value);ad.email=e;aerr='';
if(!EMAIL_RE.test(e)){aerr='Enter a valid email address.';return render()}
pend={kind:'reset',email:e,exists:!!findU(e),code:code6(),exp:Date.now()+6e5,tries:0,sent:Date.now(),verified:false};
sendEmail(e,'Your Quinqidle password reset code','Your code is '+pend.code+'. It expires in 10 minutes. If you did not ask to reset your password, ignore this message.');scr='verify';render()}
function doReset(){if(busy||!pend||!pend.verified)return;var p=$('#np').value,c=$('#nc').value;aerr='';
if(Date.now()>pend.vexp){pend=null;scr='forgot';aerr='This reset expired. Request a new code.';return render()}
if(!pwOk(p)){aerr='Use at least 8 characters, with a letter and a number.';return render()}
if(p!==c){aerr='The passwords do not match.';return render()}
var em=pend.email,u=findU(em);busy=true;var salt=b64(newSalt());
hashPw(p,salt).then(function(h){busy=false;if(u){u.salt=salt;u.hash=h;asave();fails[em]={n:0,t:0}}pend=null;scr='login';ad.email=em;aerr='';render();toast('Password updated. Log in with your new password.')}).catch(function(){busy=false;aerr='Something went wrong. Please try again.';render()})}
function fl(e){return fails[e]||(fails[e]={n:0,t:0})}
function doLogin(){if(busy)return;var e=normE($('#le').value),p=$('#lp').value;ad.email=e;aerr='';if(!SECURE)return;
var f=fl(e);if(f.n>=5&&Date.now()-f.t>=30000)f.n=0;if(f.n>=5){aerr='Too many attempts. Wait 30 seconds and try again.';return render()}
var u=findU(e);busy=true;
(u?hashPw(p,u.salt):hashPw(p,b64(newSalt())).then(function(){return null})).then(function(h){busy=false;if(u&&h&&same(h,u.hash)){f.n=0;AUTH.session=u.id;asave();enter(u)}else{f.n++;f.t=Date.now();aerr='Incorrect email or password.';render()}}).catch(function(){busy=false;aerr='Something went wrong. Please try again.';render()})}
function enter(u){ME=u;UID=u.id;role=u.role;setTimeout(subSync,0);if(!S.profiles[UID])S.profiles[UID]=newProf(u.name);S.profile=S.profiles[UID];tab=role==='client'?'jobs':'find';view=null;pview=null;chatView=null;mopen=false;ecs=0;aerr='';render();scrollTo(0,0)}
function setMode(r){role=r;ME.role=r;asave();tab=r==='client'?'jobs':'find';view=null;pview=null;chatView=null;ecs=0;render();scrollTo(0,0)}
function logout(){sbSave(null);pst={step:'choose',plan:null,inv:null,err:'',msg:'',busy:false,wallet:'',tx:''};AUTH.session=null;asave();save();ME=null;UID=null;S.profile=null;pend=null;scr='home';aerr='';ecs=0;chatView=null;pview=null;view=null;tab='jobs';render();scrollTo(0,0)}
function accountView(){var h='<h1>'+tx('account')+'</h1><p class="sub">Manage how you sign in.</p><div class="card"><b>'+esc(ME.name)+'</b><div class="note" style="margin:0">Use the switch at the top to move between Client and Freelancer.</div></div>';
if(ecs===2&&pend)return h+verifyView();
h+='<div class="card"><h2>Email address</h2><p style="margin:0 0 8px">'+esc(ME.email)+'</p>';
if(ecs===1)h+=errBox()+field('ne','New email address','email','','autocomplete="email" inputmode="email"')+pwField('cp','Re-enter your password to confirm','current-password')+'<p></p><div class="row" style="justify-content:flex-start"><button class="btn" onclick="startEmail()">Send code</button><button class="btn ghost" onclick="ecs=0;aerr=\'\';render()">Cancel</button></div>';
else h+='<button class="btn ghost" onclick="ecs=1;aerr=\'\';render()">Change email</button>';
return h+'</div>'+subCard()+prefsBar()+'<button class="btn ghost" style="width:100%" onclick="logout()">'+tx('logout')+'</button>'}
function startEmail(){if(busy)return;var e=normE($('#ne').value),p=$('#cp').value;aerr='';
if(!EMAIL_RE.test(e)){aerr='Enter a valid email address.';return render()}
if(e===ME.email){aerr='That is already your email address.';return render()}
if(findU(e)){aerr='That email address is already used by another account.';return render()}
if(!p){aerr='Enter your current password to confirm.';return render()}
busy=true;hashPw(p,ME.salt).then(function(h){busy=false;if(!same(h,ME.hash)){aerr='Incorrect password.';return render()}pend={kind:'email',newEmail:e,code:code6(),exp:Date.now()+6e5,tries:0,sent:Date.now()};otpMail(e);ecs=2;aerr='';render()}).catch(function(){busy=false;aerr='Something went wrong. Please try again.';render()})}
function finishEmail(){ME.email=pend.newEmail;asave();pend=null;ecs=0;aerr='';toast('Email address updated');render()}
AUTH=aload();S=load();
(function(){var u=AUTH.session&&AUTH.users.filter(function(x){return x.id===AUTH.session})[0];if(u)enter(u);else render()})();
